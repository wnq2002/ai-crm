# AI CRM V1.0 — Docker Compose 编排
# 四服务：db / backend / frontend(构建静态) / nginx(HTTPS 反代)
# 环境变量经 .env 注入（复制 .env.example）。凭据只进 .env，禁止提交。
# 全部镜像固定受支持稳定版本，禁止 latest。

name: ai-crm

services:
  # ── 数据库：PostgreSQL 16，持久卷 + 健康检查 ──────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_crm} -d ${POSTGRES_DB:-ai_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"   # 仅本地调试；生产部署请移除该行，数据库不直接暴露公网
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 后端：FastAPI/Uvicorn，启动时先跑 Alembic 迁移 ────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器内用 db 主机名；本地开发跑后端时用 .env 里的 localhost 值
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_crm}
      POSTGRES_HOST: db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # 用标准库探测 /healthz，不依赖容器内是否安装 curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # 不对外暴露端口，仅 nginx 反代访问
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── 前端：一次性构建静态资源到宿主机 frontend/dist ─────────
  # 契约：frontend Dockerfile 的 CMD 执行 `npm run build`，产出写入 /app/dist（即宿主机 frontend/dist）。
  frontend:
    build:
      context: ./frontend
    restart: "no"            # 构建完成后退出；nginx 等待其成功后再启动
    volumes:
      - ./frontend/dist:/app/dist
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx：HTTPS 反代 + 静态托管 + 日志轮转 ───────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro   # 仅挂载站点配置，避免误载 logrotate.conf
      - ./infra/certs:/etc/nginx/certs:ro   # TLS 证书：fullchain.pem + privkey.pem
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  nginx_logs:
