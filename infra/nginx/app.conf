# AI CRM V1.0 — Nginx 反向代理配置
# 功能：HTTP→HTTPS 跳转、TLS 终结、SPA 静态托管、/api 反代、请求体上限、
#       健康检查（不泄露配置与客户信息）、request_id 贯穿（ADR-014）。

# 请求体上限：Excel 导入 ≤10MB，预留 multipart 余量取 12m
client_max_body_size 12m;

# request_id：客户端携带 X-Request-Id 则回显，否则由 Nginx 生成（ADR-014）
map $http_x_request_id $rid {
    default $http_x_request_id;
    ""      $request_id;
}

# 访问日志不记录 query string：线索搜索的手机号/邮箱等 PII 可能出现在 URL 参数中（PRD V1.3 §9「日志不记录明文手机号/邮箱」）。
# 仅记 $request_method + $uri（去 query）+ 协议，保留方法/路径用于排障，去除 query 中的敏感信息。
log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" rid=$rid';
access_log /var/log/nginx/access.log main;

# ── HTTP：跳转 HTTPS（保留 ACME http-01 校验路径）──────────
server {
    listen 80;
    server_name _;

    # certbot / ACME 证书签发与续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：TLS 终结 + 静态资源 + API 反代 ─────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 健康检查：直接返回，不反代、不泄露配置与客户信息
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # 全栈就绪探测：反代到后端 /healthz（后端仅返回 ok，不泄露配置）
    location = /readyz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $rid;
    }

    # 前端 SPA 静态资源（history 路由回退 index.html）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代到后端 FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $rid;
        proxy_read_timeout 60s;
    }
}
