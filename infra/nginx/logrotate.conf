# AI CRM V1.0 — Nginx 访问/错误日志轮转
# 由宿主机 logrotate 调用（容器内 nginx:alpine 不含 logrotate 进程）。
# 注意：日志实际写入 Docker 卷，宿主路径形如
#   /var/lib/docker/volumes/ai-crm_nginx_logs/_data/*.log
# 请将下方路径替换为实际宿主卷路径后放入 /etc/logrotate.d/ai-crm-nginx。

/var/lib/docker/volumes/ai-crm_nginx_logs/_data/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # 通知 nginx 重新打开日志文件（USR1）
        docker exec ai-crm-nginx-1 nginx -s reopen >/dev/null 2>&1 || true
    endscript
}
